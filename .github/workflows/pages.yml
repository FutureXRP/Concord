# Deploys the fully static Concord demo to GitHub Pages - free hosting,
# no servers, no API keys. The whole standalone pipeline (validation,
# retrieval, sources-mode answers, chip resolution) runs in the visitor's
# browser against the checked-in public-domain corpus.
#
# URL after first deploy: https://futurexrp.github.io/Concord/

name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test
      # Static export cannot include server route handlers; the static build
      # uses the browser engine instead of /api/concord/*.
      - name: Remove API routes for static export
        run: rm -rf app/api
      - name: Build static export
        run: npx next build
        env:
          CONCORD_STATIC: "1"
          NEXT_PUBLIC_CONCORD_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /Concord
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
